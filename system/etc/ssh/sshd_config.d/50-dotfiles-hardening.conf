# Hardened sshd config dropped under /etc/ssh/sshd_config.d/. Ubuntu's main
# sshd_config includes this directory, so individual overrides land here
# without touching the distro file.
#
# Ports the nixcfg modules/nixos/networking.nix services.openssh block:
#   - Port 7747 (non-standard)
#   - Key-only auth, with optional TOTP for 2FA via PAM
#   - Modern crypto only (chacha20-poly1305 / aes256-gcm, PQ-hybrid KEX,
#     hmac-sha2-512-etm, ed25519 host keys)
#   - 5-minute idle timeout
#
# IMPORTANT: This file ships disabled by default — the sshd service is masked
# in scripts/install/sshd.sh unless the operator passes --enable. Before
# enabling: (1) run `google-authenticator` to seed the user's TOTP secret,
# (2) ensure your authorized_keys is in place under ~/.ssh/authorized_keys.

Port 7747

# Authentication
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication yes
PubkeyAuthentication yes
PermitEmptyPasswords no
HostbasedAuthentication no
IgnoreRhosts yes

# Require BOTH publickey AND a PAM-interactive (TOTP) factor.
AuthenticationMethods publickey,keyboard-interactive:pam

# Restrict access to specific user(s) only.
AllowUsers sam

# Connection limits
MaxAuthTries 3
MaxSessions 2
LoginGraceTime 30

# Idle session timeout (5 minutes)
ClientAliveInterval 300
ClientAliveCountMax 2

# Disable forwarding (enable only if needed)
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
GatewayPorts no

# Modern crypto only
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
HostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com
PubkeyAcceptedAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com

# Only use the ed25519 host key; ignore the distro-shipped rsa/ecdsa keys.
HostKey /etc/ssh/ssh_host_ed25519_key

# Misc hardening
UsePAM yes
PrintLastLog yes
PrintMotd no
Compression no
StrictModes yes
