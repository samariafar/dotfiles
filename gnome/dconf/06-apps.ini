[org/gnome/nautilus/preferences]
date-time-format='detailed'
default-folder-viewer='icon-view'
show-create-link=true
show-delete-permanently=true

[org/gnome/nautilus/icon-view]
default-zoom-level='small'

[com/github/stunkymonkey/nautilus-open-any-terminal]
terminal='ptyxis'
new-tab=true
use-generic-terminal-name=true

[org/gnome/desktop/default-applications/terminal]
exec='ptyxis'
exec-arg='--'

[org/gtk/gtk4/settings/file-chooser]
show-hidden=true

[org/gtk/settings/file-chooser]
show-hidden=true

[org/gnome/calculator]
accuracy=5
favorite-currencies=['EUR', 'GBP', 'USD']
show-thousands=true
refresh-interval=uint32 86400

[org/gnome/TextEditor]
highlight-current-line=true
indent-style='space'
show-line-numbers=true
spellcheck=false
tab-width=uint32 4

[org/gnome/Totem]
repeat=true

[org/gnome/Ptyxis]
audible-bell=false
default-profile-uuid='b53f399a2fbcf38ced6e3b2b69fb8e58'
interface-style='system'
profile-uuids=['b53f399a2fbcf38ced6e3b2b69fb8e58']
restore-session=false
restore-window-size=false
window-size=(uint32 80, uint32 24)

[org/gnome/Ptyxis/Profiles/b53f399a2fbcf38ced6e3b2b69fb8e58]
label='Custom'
scroll-on-keystroke=true

[org/gnome/GWeather4]
temperature-unit='centigrade'

# TODO: world-clocks + weather locations. The nixcfg has Groningen pinned for
# the Weather widget and 8 world clocks (SF / NYC / London / Paris / Berlin /
# Moscow / HK / Seoul). Their dconf representation is a deeply-nested
# GVariant tuple with float coordinates — easier to set via the Weather app
# and Clocks panel after first install and then `dconf dump` back into here.

[org/virt-manager/virt-manager/connections]
autoconnect=['qemu:///system']
uris=['qemu:///system']
