[system/locale]
region='nl_NL.UTF-8'

[org/gnome/desktop/input-sources]
sources=[('xkb', 'us'), ('xkb', 'ir+pes_keypad')]
xkb-options=['compose:ralt', 'grp:alt_shift_toggle', 'lv3:lalt_switch', 'terminate:ctrl_alt_bksp']

[org/gnome/desktop/peripherals/keyboard]
numlock-state=true

[org/gnome/desktop/peripherals/touchpad]
natural-scroll=false
two-finger-scrolling-enabled=true
