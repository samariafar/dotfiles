[org/gnome/shell/extensions/appindicator]
icon-opacity=240
tray-pos='left'

[org/gnome/shell/extensions/clipboard-indicator]
enable-keybindings=false
paste-button=false
strip-text=true

[org/gnome/shell/extensions/nightthemeswitcher/commands]
enabled=true
sunrise="gsettings set org.gnome.desktop.interface color-scheme 'prefer-light'"
sunset="gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'"

[org/gnome/shell/extensions/nightthemeswitcher/time]
nightthemeswitcher-ondemand-keybinding=['<Shift><Super>t']

[org/gnome/shell/extensions/top-bar-organizer]
center-box-order=['dateMenu']
left-box-order=['activities', 'workspace-indicator', 'claudebar@bilbilak.org', 'appindicator-kstatusnotifieritem-zero-trust-client', 'appindicator-kstatusnotifieritem-blueman']
right-box-order=['TopHat', 'screenRecording', 'clipboardIndicator', 'screenSharing', 'dwellClick', 'a11y', 'keyboard', 'quickSettings']

[org/gnome/shell/extensions/weather-oclock]
weather-after-clock=true

[org/gnome/shell/extensions/tophat]
cpu-show-cores=true
cpu-sort-cores=false
mem-abs-units=false
mount-to-monitor='/home'
network-usage-unit='bits'
position-in-panel='right'
show-disk=true
show-net=true

[org/gnome/shell/extensions/dash-to-dock]
apply-custom-theme=false
background-opacity=0.8
click-action='minimize'
custom-theme-shrink=true
dash-max-icon-size=42
dock-position='BOTTOM'
height-fraction=0.9
preferred-monitor=-2
running-indicator-style='DOTS'
scroll-action='cycle-windows'
show-mounts=false
show-mounts-only-mounted=false

[org/gnome/shell/extensions/ding]
arrangeorder='KIND'
check-x11wayland=true
dark-text-in-labels=false
icon-size='tiny'
keep-arranged=true
show-home=false
show-trash=false
show-volumes=false

[org/gnome/shell/extensions/pip-on-top]
stick=true
