# Firefox extension manifest. Installed via the `ExtensionSettings` policy
# (Firefox's enterprise-policy mechanism), which works against snap-confined
# Firefox and survives profile resets.
#
# Each entry:
#   id:        extension id — email-shaped (`name@domain`) or UUID-in-braces
#   url:       install_url (typically https://addons.mozilla.org/...)
#   options:   optional map merged into the per-extension policy entry; use to
#              override `installation_mode`, `default_area`, `private_browsing`
#   note:      free-form rationale

extensions:
  # --- core privacy / containers / tab management -----------------------------

  - id: uBlock0@raymondhill.net
    url: https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi
    options: { default_area: navbar, private_browsing: true }

  - id: "{446900e4-71c2-419f-a6a7-df9c091e268b}"
    url: https://addons.mozilla.org/firefox/downloads/latest/bitwarden-password-manager/latest.xpi
    options: { default_area: navbar }
    note: Bitwarden

  - id: "@testpilot-containers"
