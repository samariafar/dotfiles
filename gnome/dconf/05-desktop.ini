[org/gnome/system/location]
enabled=true
max-accuracy-level='city'

[org/gnome/desktop/notifications]
show-in-lock-screen=false

[org/gnome/desktop/break-reminders/eyesight]
play-sound=true

[org/gnome/desktop/break-reminders/movement]
duration-seconds=uint32 300
interval-seconds=uint32 1800
play-sound=true

[org/gnome/desktop/search-providers]
sort-order=['org.gnome.Settings.desktop', 'org.gnome.Contacts.desktop', 'org.gnome.Nautilus.desktop']

[org/gnome/desktop/privacy]
old-files-age=uint32 2
remember-recent-files=false
remove-old-temp-files=true
remove-old-trash-files=true

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'
num-workspaces=6

[org/gnome/mutter]
center-new-windows=true
dynamic-workspaces=false
workspaces-only-on-primary=true

[org/gnome/settings-daemon/plugins/power]
power-button-action='nothing'
sleep-inactive-ac-type='nothing'

[org/gnome/settings-daemon/plugins/color]
night-light-enabled=true
night-light-temperature=uint32 3700

[org/gnome/desktop/sound]
allow-volume-above-100-percent=true

[org/gnome/desktop/interface]
accent-color='blue'
clock-show-weekday=true
color-scheme='prefer-dark'
enable-hot-corners=true
show-battery-percentage=true

[org/gnome/desktop/calendar]
show-weekdate=true

# Ubuntu 26 wallpaper paths. The user's nixcfg used the NixOS-shipped pixel-pusher
# variants under /run/current-system/sw/share/backgrounds/gnome/ — those don't
# exist on Ubuntu. The default Ubuntu 26 wallpaper is shipped under
# /usr/share/backgrounds/. Override here to the user's preference once chosen.
[org/gnome/desktop/background]
picture-options='zoom'
# TODO: set picture-uri / picture-uri-dark to a path under /usr/share/backgrounds/
#       or ~/Pictures/Wallpapers/ once a preferred Ubuntu wallpaper is picked.

[org/gnome/desktop/screensaver]
picture-options='zoom'
# TODO: same as above.
